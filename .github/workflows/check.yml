name: linux-check

# Сборка + тесты на Ubuntu при каждом push: C - gcc и valgrind, Java - javac (JDK 17).
# Проверяется каждая лабораторная, в папке которой есть Makefile:
# course*/<предмет>/labN/Makefile -> make (с -Werror), make test, make memcheck.
# В Java-лабах CFLAGS не используется, а make memcheck ничего не делает (память освобождает сборщик мусора).
on: [push, pull_request, workflow_dispatch]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Build, tests, valgrind (every lab with a Makefile)
        run: |
          status=0
          for mk in $(find course* -path '*/lab*/Makefile' | sort); do
            lab=$(dirname "$mk")
            echo "::group::$lab"
            if ! (cd "$lab" \
                  && make CFLAGS="-std=c99 -Wall -Wextra -Wpedantic -g -Werror" \
                  && make test \
                  && make memcheck); then
              echo "::error::$lab: check failed"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status
